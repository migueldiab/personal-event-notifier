defaults: &defaults
  date_range_days: 7
  request_timeout: 30
  request_delay: 2
  max_retries: 3
  log_level: INFO
  enabled_scrapers:
    - austin_chronicle
    - do512
    - community_impact
    - eventbrite_austin
    - acl_live
    - stubbss
    - paramount_austin

development:
  <<: *defaults
  log_level: DEBUG

production:
  <<: *defaults
  log_level: WARN

test:
  <<: *defaults
  log_level: WARN
