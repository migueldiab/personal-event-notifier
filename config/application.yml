defaults: &defaults
  date_range_days: 7
  request_timeout: 30
  request_delay: 2
  max_retries: 3
  log_level: INFO
  # Archived-only Cedar Park calendar (CedarParkCalendarScraper / Wayback
  # snapshot). The live calendar, iCalendar and API paths on cedarparktexas.gov
  # are Cloudflare-blocked, so there is no proven live fetch path. OFF by
  # default: enabling it would surface stale historical events in the digest.
  # To opt in, set this to true AND add `cedar_park_calendar` to the list below.
  # enable_cedar_park_calendar: false
  enabled_scrapers:
    - austin_chronicle
    - do512
    - community_impact
    - eventbrite_austin
    - acl_live
    - stubbss
    - paramount_austin
    # Simpleview JSON API behind an Akamai wall; a 200 may be a JS shell with no
    # "docs" data. Set cached_fixture_path to a VCR cassette to replay captures.
    - visit_cedar_park
    - cedar_park

development:
  <<: *defaults
  log_level: DEBUG

production:
  <<: *defaults
  log_level: WARN

test:
  <<: *defaults
  log_level: WARN
