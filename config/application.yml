defaults: &defaults
  date_range_days: 7
  request_timeout: 30
  request_delay: 2
  max_retries: 3
  log_level: INFO
  enabled_scrapers:
    - austin_chronicle
    - do512
    - community_impact
    - eventbrite_austin
    - acl_live
    - stubbss
    - paramount_austin
    # Simpleview JSON API behind an Akamai wall; a 200 may be a JS shell with no
    # "docs" data. Set cached_fixture_path to a VCR cassette to replay captures.
    - visit_cedar_park
    - cedar_park

development:
  <<: *defaults
  log_level: DEBUG

production:
  <<: *defaults
  log_level: WARN

test:
  <<: *defaults
  log_level: WARN
